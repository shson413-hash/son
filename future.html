<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>10분 뒤의 나 뭐함? | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a><nav class='navlinks'><a href='future.html'>10분 뒤</a><a href='decide.html'>결정해줘</a><a href='balance.html'>밸런스</a><a href='food.html'>뭐먹지</a><a href='excuse.html'>핑계제조기</a></nav></div></header><main class='page'><div class='page-head'><div class='big'>⏳</div><h1>10분 뒤의 나 뭐함?</h1><p>현재의 내가 미래의 나에게 무책임하게 업무를 떠넘깁니다.</p></div><section class='panel'><div class='chips'><button class='chip active' data-min='10'>10분</button><button class='chip' data-min='30'>30분</button><button class='chip' data-min='60'>1시간</button><button class='chip' data-min='180'>3시간</button></div><button class='btn hot wide' id='futureDraw'>미래 스포당하기 🔮</button><div id='result' class='result'><div class='result-emoji' id='emoji'>🛋️</div><h2 id='title'></h2><p id='desc'></p><div class='countdown' id='time'></div><div class='meter'><span id='meter'></span></div><p id='prob'></p><div class='sharebar'><button class='btn secondary' id='futureAgain'>미래 재협상</button><button class='btn' id='futureShare'>친구한테 박제</button></div></div></section><div class='ad-slot'>광고 자리 · 추후 AdSense 연결</div><h2 class='section-title'>미래가 싫으면 다른 현실도피</h2><div class='grid'><a class='card' href='reels.html'><div class='emoji'>📱</div><h2>5분만 릴스 판독기</h2><p>5분이 47분이 될 확률 계산.</p></a><a class='card' href='afterwork.html'><div class='emoji'>👻</div><h2>퇴근 후 세계선</h2><p>운동할지 침대와 합체할지 예측.</p></a><a class='card' href='battery.html'><div class='emoji'>🪫</div><h2>사회성 배터리</h2><p>오늘 남은 인간 응대 가능량 측정.</p></a></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함 · 쓸데없지만 은근 유용함</span><span><a href='index.html'>홈</a><a href='privacy.html'>개인정보</a></span></div></footer><script src='app.js'></script><script>(()=>{let mins=10;const acts=[['🛏️','침대와 전략적 제휴','분명 뭔가 하려 했는데 침대가 먼저 협상에 들어옴.'],['🍜','갑자기 뭔가 먹는 중','배고프지 않았는데 미래의 내가 배달앱을 켬.'],['📱','릴스 47개째 보는 중','5분만 본다는 발언은 이미 폐기됨.'],['🧹','갑자기 청소 시작','해야 할 일보다 서랍 정리가 더 긴급해짐.'],['💸','쓸데없는 거 결제 직전','필요 없음. 하지만 예쁨. 매우 위험.'],['🚶','의미 없이 밖에 나감','산책인지 현실 도피인지 본인도 모름.'],['💻','갑자기 갓생 모드','미래의 내가 정신 차릴 확률이 기적적으로 발생.'],['☕','카페인으로 문제 해결 시도','문제는 그대로인데 기분은 좀 나아짐.'],['🤡','아무것도 안 하고 있음','그리고 이 예언을 보고도 안 움직일 가능성이 큼.']];const resultEl=document.getElementById('result'),emojiEl=document.getElementById('emoji'),titleEl=document.getElementById('title'),descEl=document.getElementById('desc'),timeEl=document.getElementById('time'),meterEl=document.getElementById('meter'),probEl=document.getElementById('prob'),drawBtn=document.getElementById('futureDraw'),againBtn=document.getElementById('futureAgain'),shareBtn=document.getElementById('futureShare');function runFuture(){const a=pick(acts),p=randPercent(54,98);emojiEl.textContent=a[0];titleEl.textContent=`${mins}분 뒤: ${a[1]}`;descEl.textContent=a[2];timeEl.textContent=`T+${mins} MIN`;probEl.textContent=`현실화 가능성 ${p}%`;meterEl.style.width=p+'%';showResult(resultEl)}$$('.chip').forEach(c=>c.addEventListener('click',()=>{$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');mins=Number(c.dataset.min)}));drawBtn.addEventListener('click',runFuture);againBtn.addEventListener('click',runFuture);shareBtn.addEventListener('click',()=>shareResult('미래의 나 스포',titleEl.textContent+' · '+descEl.textContent));})();</script></body></html>
