<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>오늘 뭐먹지? | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a><nav class='navlinks'><a href='future.html'>10분 뒤</a><a href='decide.html'>결정해줘</a><a href='balance.html'>밸런스</a><a href='food.html'>뭐먹지</a><a href='excuse.html'>핑계제조기</a></nav></div></header><main class='page'><div class='page-head'><div class='big'>🍜</div><h1>오늘 뭐먹지?</h1><p>배고픔보다 메뉴 고르는 게 더 힘든 사람 전용.</p></div><section class='panel'><div class='chips'><button class='chip active' data-cat='all'>아무거나</button><button class='chip' data-cat='hot'>매운 거</button><button class='chip' data-cat='light'>가볍게</button><button class='chip' data-cat='money'>가성비</button></div><button id='go' class='btn hot wide'>메뉴 룰렛 돌리기 🍽️</button><div id='result' class='result'><div class='result-emoji' id='emoji'></div><h2 id='menu'></h2><p id='desc'></p><div class='sharebar'><button class='btn secondary' id='again'>다시 뽑기</button><button class='btn' id='share'>같이 먹을 사람 호출</button></div></div></section><div class='ad-slot'>광고 자리 · 추후 음식/배달 제휴도 가능</div></main><script src='app.js'></script><script>const foods=[['🍲','부대찌개','hot','밥 두 공기 각. 오늘은 탄수화물이 팀장임.'],['🍜','마라탕','hot','맵기는 선택인데 후회는 기본 옵션.'],['🍚','제육볶음','money','고민 끝. 한국인의 비상 탈출구.'],['🥟','만두 + 쫄면','money','싸고 강하다. 자취생 국룰 조합.'],['🥗','포케','light','건강한 척하기 좋은 날.'],['🍣','초밥','light','깔끔하게 먹고 통장은 약간 울기.'],['🍗','치킨','all','이건 메뉴가 아니라 사회적 합의.'],['🍕','피자','all','조각 수로 우정이 시험대에 오름.'],['🍛','카레','money','한 번 해두면 미래의 나까지 먹여 살림.'],['🥘','김치찜','hot','밥도둑 현행범 체포.'],['🍝','파스타','light','오늘만큼은 분위기 있는 척 가능.'],['🥪','샌드위치','light','밥 먹고 졸릴 시간까지 아껴줌.']];let cat='all';function draw(){const pool=cat==='all'?foods:foods.filter(x=>x[2]===cat||x[2]==='all');const f=pick(pool);emoji.textContent=f[0];menu.textContent=f[1];desc.textContent=f[3];showResult(result)}$$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');cat=c.dataset.cat});go.onclick=draw;again.onclick=draw;share.onclick=()=>shareResult('오늘 뭐먹지?',`오늘 메뉴: ${menu.textContent} 🍽️`);</script></body></html>
