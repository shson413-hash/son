<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='google-adsense-account' content='ca-pub-7617620451620053'><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7617620451620053' crossorigin='anonymous'></script><meta name='description' content='오늘뭐함 오리지널 캐릭터 네 명 중 한 명이 건네는 가벼운 오늘의 한마디.'><title>오늘의 최애 멘트 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>💘 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>🎧</div><h1>오늘의 최애 멘트</h1><p>JAYDEN·KAEL·RIO·LIAM 중 한 명에게 오늘 한마디 받아가.</p></div><section class='panel'><button class='btn hot wide' id='go'>오늘 한마디 받기</button><div class='result' id='res'><img id='charImg' src='assets/jayden.webp' alt='오늘뭐함 오리지널 캐릭터' style='max-height:300px;max-width:100%;object-fit:contain'><h2 id='who'></h2><p id='line' style='font-size:20px;color:white'></p><div class='sharebar'><button class='btn secondary' id='save'>카드 저장</button><button class='btn' id='share'>공유하기</button></div></div></section><div class='content-block'><h2>캐릭터마다 말투도 달라</h2><p>JAYDEN은 차분하고 현실적인 말, KAEL은 짧고 담백한 말, RIO는 장난 섞인 직설, LIAM은 부드럽게 다독이는 말이 나오도록 자체 설정했어. 실제 연예인의 말투나 발언을 모방하지 않아.</p></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함</span><a href='index.html'>홈</a></div></footer><script src='app.js'></script><script>(()=>{const lines=[{name:'JAYDEN',img:'assets/jayden.webp',line:'오늘 너무 잘하려고 하지 마. 할 거 하나만 끝내도 충분해.'},{name:'JAYDEN',img:'assets/jayden.webp',line:'미룬 거 하나만 10분 해보고 그 뒤에 진짜 놀자. 약속.'},{name:'KAEL',img:'assets/kael.webp',line:'답 안 나오는 건 잠깐 내려놔. 생각보다 내일의 네가 잘 처리함.'},{name:'KAEL',img:'assets/kael.webp',line:'남이 어떻게 볼지는 지금 네가 해결할 문제가 아니야. 네 쪽부터 챙겨.'},{name:'RIO',img:'assets/zico.webp',line:'오늘 망했다고? 아직 오늘 안 끝났는데 벌써 결론 내리지 마 ㅋㅋ'},{name:'RIO',img:'assets/zico.webp',line:'그 메시지 14번 다시 읽지 말고 보내거나 폰 내려놔. 둘 중 하나.'},{name:'LIAM',img:'assets/liam.webp',line:'네가 생각하는 것보다 오늘 꽤 잘 버텼어. 이제 좀 쉬어도 돼.'},{name:'LIAM',img:'assets/liam.webp',line:'오늘 마음에 걸린 건 내일까지 다 들고 가지 않아도 괜찮아.'}];const go=document.getElementById('go'),res=document.getElementById('res'),charImg=document.getElementById('charImg'),who=document.getElementById('who'),line=document.getElementById('line'),share=document.getElementById('share'),save=document.getElementById('save');let current=null;go.addEventListener('click',()=>{current=pick(lines);charImg.src=current.img;charImg.alt=`${current.name} 오리지널 캐릭터`;who.textContent=current.name;line.textContent='“'+current.line+'”';showResult(res)});share.addEventListener('click',()=>shareResult('오늘의 최애 멘트',current?`${current.name} · ${current.line}`:'오늘뭐함'));save.addEventListener('click',()=>current&&downloadResultCard(current.name,current.line,current.img))})();</script></body></html>
