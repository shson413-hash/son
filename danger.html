<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='google-adsense-account' content='ca-pub-7617620451620053'><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7617620451620053' crossorigin='anonymous'></script><meta name='description' content='체크한 취향으로 내 취향 위험도와 가장 취약한 오리지널 캐릭터 타입을 재미로 분석.'><title>내 취향 위험도 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>💘 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>🚨</div><h1>내 취향 위험도</h1><p>왜 맨날 비슷한 타입에 흔들리는지 체크하고, 네가 가장 취약한 캐릭터까지 찾아봐.</p></div><section class='panel'><div class='list'><label class='mini'><input type='checkbox' class='ck' data-char='center'> 무심한데 나한테만 다른 캐릭터가 좋다</label><label class='mini'><input type='checkbox' class='ck' data-char='rapper'> 장난치다가 갑자기 진지해지는 갭에 약하다</label><label class='mini'><input type='checkbox' class='ck' data-char='leader'> 말보다 행동으로 챙기는 타입에 약하다</label><label class='mini'><input type='checkbox' class='ck' data-char='center'> 패션·분위기가 좋으면 서사를 자동 생성한다</label><label class='mini'><input type='checkbox' class='ck' data-char='vocal'> 다정한 한마디를 며칠 동안 기억한다</label><label class='mini'><input type='checkbox' class='ck' data-char='leader'> 약속 잘 지키고 안정적인 타입에 오래 끌린다</label><label class='mini'><input type='checkbox' class='ck' data-char='vocal'> 사소한 취향까지 기억해주는 사람에 약하다</label><label class='mini'><input type='checkbox' class='ck' data-char='rapper'> 친구처럼 티키타카 되는 관계가 좋다</label></div><button class='btn hot wide' id='go'>위험도 측정</button><div class='result' id='res'><img id='charImg' src='assets/jayden.webp' alt='취향 결과 캐릭터' style='max-height:280px;max-width:100%;object-fit:contain'><h2 id='rt'></h2><p id='weak'></p><p id='rd'></p><div class='meter'><span id='bar'></span></div><p id='score'></p><div class='sharebar'><button class='btn secondary' id='save'>카드 저장</button><button class='btn' id='share'>친구한테 검거 요청</button></div></div></section><div class='content-block'><h2>결과 기준</h2><p>선택한 문항 수로 위험도를 만들고, 각 문항에 연결된 리더상·센터상·장꾸상·다정상 점수를 합쳐 가장 많이 선택한 캐릭터를 함께 보여줘. 심리 진단이나 실제 연애 성향 검사는 아니야.</p></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함</span><a href='index.html'>홈</a></div></footer><script src='app.js'></script><script>(()=>{const profiles={leader:{name:'JAYDEN',type:'리더상',img:'assets/jayden.webp'},center:{name:'KAEL',type:'센터상',img:'assets/kael.webp'},rapper:{name:'RIO',type:'장꾸상',img:'assets/zico.webp'},vocal:{name:'LIAM',type:'다정상',img:'assets/liam.webp'}};const checks=$$('.ck'),go=document.getElementById('go'),res=document.getElementById('res'),charImg=document.getElementById('charImg'),rt=document.getElementById('rt'),rd=document.getElementById('rd'),weak=document.getElementById('weak'),scoreEl=document.getElementById('score'),bar=document.getElementById('bar'),share=document.getElementById('share'),save=document.getElementById('save');let current=null;go.addEventListener('click',()=>{const selected=checks.filter(c=>c.checked),n=selected.length,s=Math.min(99,18+n*9+randPercent(0,7)),tally={leader:0,center:0,rapper:0,vocal:0};selected.forEach(c=>tally[c.dataset.char]++);let key='leader';if(n>0){const max=Math.max(...Object.values(tally)),ties=Object.keys(tally).filter(k=>tally[k]===max);key=ties[Math.floor(Math.random()*ties.length)]}const ch=profiles[key];current={s,ch};rt.textContent=n===0?'🫧 아직 취향 미확정':s>80?'🚨 취향 과몰입 위험구역':s>55?'⚠️ 취향 패턴 꽤 선명함':'✅ 아직은 평온한 편';rd.textContent=n===0?'아무것도 체크하지 않았어. 아직 네 취향을 사이트에 넘겨줄 생각이 없는 사람.':s>80?'캐릭터가 한 번만 취향 저격 행동을 해도 머릿속에서 이미 12부작 제작 완료 가능성.':s>55?'“난 딱히 타입 없어”라고 하기엔 선택 패턴이 꽤 또렷해졌어.':'몇 가지 취향은 있지만 아직 한 타입이 모든 판단을 지배하진 않는 편.';weak.textContent=n===0?'기본 안내 담당 · JAYDEN':`가장 취약한 타입 · ${ch.name} (${ch.type})`;charImg.src=ch.img;charImg.alt=`${ch.name} 오리지널 캐릭터`;scoreEl.textContent=`재미용 위험도 ${s}%`;bar.style.width=s+'%';showResult(res)});share.addEventListener('click',()=>shareResult('내 취향 위험도',current?`${rt.textContent} · ${weak.textContent} · ${current.s}%`:'오늘뭐함'));save.addEventListener('click',()=>current&&downloadResultCard(rt.textContent,`${weak.textContent} · 재미용 위험도 ${current.s}%`,current.ch.img))})();</script></body></html>
