향의 지배를 받지 않음';rd.textContent=s>80?'캐릭터가 한 번만 다정해도 이미 머릿속에서 12부작 제작 완료 가능성.':s>55?'“난 아무 타입 없어”라고 하기엔 선택 패턴이 꽤 선명함.':'오늘은 비교적 평온. 하지만 다음 캐릭터 등장 전까지의 이야기일 수 있음.';score.textContent=`재미용 위험도 ${s}%`;bar.style.width=s+'%';showResult(res);window.r=[rt.textContent,rd.textContent]};share.onclick=()=>shareResult('내 취향 위험도',window.r?window.r.join(' · '):'오늘뭐함');save.onclick=()=>window.r&&downloadResultCard(window.r[0],window.r[1],'assets/jayden.webp')})();</script></body></html>
