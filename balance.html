<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>밸런스 지옥 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a><nav class='navlinks'><a href='future.html'>10분 뒤</a><a href='decide.html'>결정해줘</a><a href='balance.html'>밸런스</a><a href='food.html'>뭐먹지</a><a href='excuse.html'>핑계제조기</a></nav></div></header><main class='page'><div class='page-head'><div class='big'>⚔️</div><h1>밸런스 지옥</h1><p>둘 다 싫어도 하나는 골라야 다음 문제가 열립니다.</p></div><section class='panel'><div class='versus'><button id='a' class='choice'></button><div class='vs'>VS</div><button id='b' class='choice'></button></div><div id='result' class='result'><h2 id='judge'></h2><p id='stats'></p><button class='btn hot wide' id='next'>다음 지옥</button><div class='sharebar'><button class='btn secondary' id='share'>이 문제 공유</button></div></div></section><div class='ad-slot'>광고 자리 · 문제 몇 개마다 광고 노출 가능</div></main><script src='app.js'></script><script>const qs=[['평생 카톡 답장 1분 안에 하기','평생 전화 오면 무조건 받기'],['치킨 먹을 때 평생 콜라 금지','피자 먹을 때 평생 치즈 금지'],['내 흑역사 영상 친구 단톡 공개','전애인에게 새벽 2시 “자니?” 보내기'],['평생 와이파이 2칸','평생 배터리 18%'],['매일 아침 5시 기상','매일 새벽 3시 취침'],['월급 2배인데 월요일 2번','월급 그대로인데 금요일 없음'],['평생 사진 찍을 때 눈 감기','평생 영상 찍을 때 재채기'],['라면 끓일 때 스프 반만','떡볶이 먹을 때 어묵 금지']];let cur;function load(){cur=pick(qs);a.textContent=cur[0];b.textContent=cur[1];result.classList.remove('show')}function choose(x){const p=randPercent(31,69);judge.textContent=`너는 “${cur[x]}” 파`;stats.textContent=`가상의 전국민 투표에서 ${p}%가 너랑 같은 선택을 했다고 우겨봄.`;showResult(result)}a.onclick=()=>choose(0);b.onclick=()=>choose(1);next.onclick=load;share.onclick=()=>shareResult('밸런스 지옥',`${cur[0]} VS ${cur[1]} 너라면?`);load();</script></body></html>
