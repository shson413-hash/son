<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='google-adsense-account' content='ca-pub-7617620451620053'><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7617620451620053' crossorigin='anonymous'></script><meta name='description' content='친구 이름 두 개로 재미용 취향 궁합과 함께 공유 최애캐 타입을 뽑는 오리지널 캐릭터 테스트.'><title>친구랑 취향 궁합 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>💘 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>👯</div><h1>친구랑 취향 궁합</h1><p>별명 두 개를 넣으면 취향 궁합과 둘이 같이 흔들릴 캐릭터 타입을 보여줘.</p></div><section class='panel'><input class='input' id='nameA' placeholder='내 이름 또는 별명'><br><br><input class='input' id='nameB' placeholder='친구 이름 또는 별명'><br><br><button class='btn hot wide' id='go'>취향 궁합 측정</button><div class='result' id='res'><img id='charImg' src='assets/jayden.webp' alt='오리지널 캐릭터 결과' style='max-height:280px;max-width:100%;object-fit:contain'><h2 id='rt'></h2><p id='charName'></p><p id='rd'></p><div class='meter'><span id='bar'></span></div><p id='score'></p><div class='sharebar'><button class='btn secondary' id='save'>카드 저장</button><button class='btn' id='share'>상대한테 보내기</button></div></div></section><div class='content-block'><h2>어떻게 계산해?</h2><p>입력한 이름은 서버로 전송하거나 저장하지 않고 이 페이지 안에서 같은 이름 조합이면 같은 결과가 나오도록 숫자로 변환해. 궁합과 캐릭터 타입은 모두 오락용이며 실제 관계 적합성을 뜻하지 않아.</p></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함</span><a href='index.html'>홈</a></div></footer><script src='app.js'></script><script>(()=>{const chars=[{name:'JAYDEN',img:'assets/jayden.webp',type:'리더상'},{name:'KAEL',img:'assets/kael.webp',type:'센터상'},{name:'RIO',img:'assets/zico.webp',type:'장꾸상'},{name:'LIAM',img:'assets/liam.webp',type:'다정상'}];const nameA=document.getElementById('nameA'),nameB=document.getElementById('nameB'),go=document.getElementById('go'),res=document.getElementById('res'),rt=document.getElementById('rt'),rd=document.getElementById('rd'),score=document.getElementById('score'),bar=document.getElementById('bar'),charImg=document.getElementById('charImg'),charName=document.getElementById('charName'),share=document.getElementById('share'),save=document.getElementById('save');let current=null;function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}go.addEventListener('click',()=>{const x=nameA.value.trim()||'나',y=nameB.value.trim()||'친구',seed=hash([x,y].sort().join('|')),s=45+(seed%55),ch=chars[(seed>>>8)%chars.length];current={x,y,s,ch};rt.textContent=s>82?'💞 취향 공동운명체':s>64?'🤝 꽤 강한 취향 동맹':'⚔️ 같은 걸 보고 다른 사람 고를 사이';rd.textContent=s>82?'추천 하나 보내면 같이 빠질 가능성이 높은 조합. 취향 토론보다 동의가 더 많이 나올 듯.':s>64?'큰 방향은 비슷한데 디테일에서 최애가 갈릴 수 있어. 그래서 같이 보면 더 재밌음.':'같은 팀을 봐도 서로 다른 타입을 고를 가능성이 큼. 최애 겹칠 걱정은 적은 편.';charName.textContent=`둘의 공통 흔들림 후보 · ${ch.name} (${ch.type})`;charImg.src=ch.img;charImg.alt=`${ch.name} 오리지널 캐릭터`;score.textContent=`${x} × ${y} 취향 궁합 ${s}%`;bar.style.width=s+'%';showResult(res)});share.addEventListener('click',()=>shareResult('친구랑 취향 궁합',current?`${current.x} × ${current.y} ${current.s}% · ${current.ch.name}`:'오늘뭐함'));save.addEventListener('click',()=>current&&downloadResultCard(`${current.x} × ${current.y} · ${current.s}%`,`공통 흔들림 후보 ${current.ch.name} (${current.ch.type})`,current.ch.img))})();</script></body></html>
