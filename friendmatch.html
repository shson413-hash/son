<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='google-adsense-account' content='ca-pub-7617620451620053'><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7617620451620053' crossorigin='anonymous'></script><meta name='description' content='친구 이름 두 개로 가볍게 보는 취향 궁합 게임.'><title>친구랑 취향 궁합 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>👯</div><h1>친구랑 취향 궁합</h1><p>이름 두 개만 넣고 얼마나 취향 동맹인지 재미로 확인해봐.</p></div><section class='panel'><input class='input' id='a' placeholder='내 이름 또는 별명'><br><br><input class='input' id='b' placeholder='친구 이름 또는 별명'><br><br><button class='btn hot wide' id='go'>취향 궁합 측정</button><div class='result' id='res'><div class='result-emoji'>👯</div><h2 id='rt'></h2><p id='rd'></p><div class='meter'><span id='bar'></span></div><p id='score'></p><div class='sharebar'><button class='btn secondary' id='save'>카드 저장</button><button class='btn' id='share'>상대한테 보내기</button></div></div></section><div class='content-block'><h2>어떻게 계산해?</h2><p>입력한 이름은 서버로 전송하거나 저장하지 않고 이 페이지 안에서 재미용 숫자를 만드는 데만 사용해. 실제 관계나 취향 적합성을 측정하는 기능은 아니야.</p></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함</span><a href='index.html'>홈</a></div></footer><script src='app.js'></script><script>(()=>{function hash(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}go.onclick=()=>{const x=a.value.trim()||'나',y=b.value.trim()||'친구',s=45+((hash(x+'|'+y)%55));rt.textContent=s>82?'💞 취향 공동운명체':s>64?'🤝 꽤 강한 취향 동맹':'⚔️ 같은 걸 보고 다른 사람 고를 사이';rd.textContent=s>82?'추천 하나 보내면 그대로 빠질 확률 높음. 같이 테스트하면 토론보다 동의가 더 많이 나올 조합.':s>64?'큰 방향은 비슷한데 디테일에서 최애가 갈릴 수 있음. 그래서 더 재밌음.':'같은 그룹을 봐도 서로 다른 타입 고를 가능성. 최애 겹칠 걱정은 적은 편.';score.textContent=`${x} × ${y} 취향 궁합 ${s}%`;bar.style.width=s+'%';showResult(res);window.r=[score.textContent,rd.textContent]};share.onclick=()=>shareResult('친구랑 취향 궁합',window.r?window.r.join(' · '):'오늘뭐함');save.onclick=()=>window.r&&downloadResultCard(window.r[0],window.r[1],'assets/jayden.webp')})();</script></body></html>
