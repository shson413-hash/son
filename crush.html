<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='google-adsense-account' content='ca-pub-7617620451620053'><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7617620451620053' crossorigin='anonymous'></script><meta name='description' content='답장 시간과 말투를 넣으면 오리지널 캐릭터가 재미용 썸 온도를 알려주는 테스트.'><title>썸 답장 온도계 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>💘 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>💬</div><h1>썸 답장 온도계</h1><p>답장 몇 분 걸렸는지와 말투를 넣으면 오늘뭐함 캐릭터가 과몰입 금지용 판정을 해줘.</p></div><section class='panel'><label for='mins'>답장까지 걸린 시간(분)</label><input class='input' id='mins' type='number' min='0' value='12'><br><br><label>답장 느낌</label><div class='chips'><button class='chip active' data-v='2'>질문까지 함</button><button class='chip' data-v='1'>평범함</button><button class='chip' data-v='0'>단답</button></div><button class='btn hot wide' id='go'>온도 재기 🌡️</button><div class='result' id='res'><img id='advisorImg' src='assets/jayden.webp' alt='오늘뭐함 상담 캐릭터' style='max-height:280px;max-width:100%;object-fit:contain'><h2 id='rt'></h2><p id='advisor'></p><p id='rd'></p><div class='meter'><span id='bar'></span></div><p id='score'></p><div class='sharebar'><button class='btn secondary' id='save'>결과 카드 저장</button><button class='btn' id='share'>친구한테 보내기</button></div></div></section><div class='content-block'><h2>진짜 호감도 검사야?</h2><p>아니야. 사람마다 연락 습관과 상황이 달라 답장 속도만으로 상대의 감정을 판단할 수 없어. 이 페이지는 입력값을 바탕으로 캐릭터가 한마디를 던져주는 엔터테인먼트 테스트야.</p></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함</span><a href='index.html'>홈</a></div></footer><script src='app.js'></script><script>(()=>{const mins=document.getElementById('mins'),go=document.getElementById('go'),res=document.getElementById('res'),rt=document.getElementById('rt'),rd=document.getElementById('rd'),score=document.getElementById('score'),bar=document.getElementById('bar'),advisor=document.getElementById('advisor'),advisorImg=document.getElementById('advisorImg'),share=document.getElementById('share'),save=document.getElementById('save');let vibe=2,current=null;$$('.chip').forEach(c=>c.addEventListener('click',()=>{$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');vibe=Number(c.dataset.v)}));go.addEventListener('click',()=>{const m=Math.max(0,Number(mins.value)||0);let s=Math.max(18,Math.min(96,88-m*.65+vibe*8+randPercent(-5,5)));s=Math.round(s);current=s>75?{name:'LIAM',img:'assets/liam.webp',title:'🔥 대화 계속될 온도',text:'답장보다 중요한 건 대화가 자연스럽게 이어지는지. 일단 분위기는 괜찮은 세계선.'}:s>50?{name:'JAYDEN',img:'assets/jayden.webp',title:'🌤️ 아직 판단 보류',text:'한 번의 답장만으로 결론 내리지 말고 다음 대화 흐름을 보는 게 낫겠어.'}:{name:'KAEL',img:'assets/kael.webp',title:'🧊 폰 내려놓고 내 할 일 하기',text:'답장창 새로고침은 여기까지. 지금은 상대 분석보다 네 할 일을 하는 세계선.'};rt.textContent=current.title;rd.textContent=current.text;advisor.textContent=`오늘의 판정 담당 · ${current.name}`;advisorImg.src=current.img;advisorImg.alt=`${current.name} 오리지널 캐릭터`;score.textContent=`오늘의 재미용 온도 ${s}°`;bar.style.width=s+'%';showResult(res);window.resultTxt=`${current.name} · ${current.title} · ${score.textContent}`});share.addEventListener('click',()=>shareResult('썸 답장 온도계',window.resultTxt||'오늘뭐함'));save.addEventListener('click',()=>current&&downloadResultCard(`${current.name} · ${current.title}`,current.text,current.img))})();</script></body></html>
