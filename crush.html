<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='google-adsense-account' content='ca-pub-7617620451620053'><script async src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7617620451620053' crossorigin='anonymous'></script><meta name='description' content='답장 시간과 길이를 넣으면 재미로 보는 썸 답장 온도계.'><title>썸 답장 온도계 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>💬</div><h1>썸 답장 온도계</h1><p>답장 몇 분 걸렸는지와 말투를 넣고, 과몰입 금지용 재미 판정을 받아봐.</p></div><section class='panel'><label>답장까지 걸린 시간(분)</label><input class='input' id='mins' type='number' min='0' value='12'><br><br><label>답장 느낌</label><div class='chips'><button class='chip active' data-v='2'>질문까지 함</button><button class='chip' data-v='1'>평범함</button><button class='chip' data-v='0'>단답</button></div><button class='btn hot wide' id='go'>온도 재기 🌡️</button><div class='result' id='res'><div class='result-emoji'>💘</div><h2 id='rt'></h2><p id='rd'></p><div class='meter'><span id='bar'></span></div><p id='score'></p><div class='sharebar'><button class='btn secondary' id='save'>결과 카드 저장</button><button class='btn' id='share'>친구한테 보내기</button></div></div></section><div class='content-block'><h2>진짜 호감도 검사야?</h2><p>아니야. 사람마다 연락 습관과 상황이 다르기 때문에 답장 속도만으로 관계를 판단할 수 없어. 이 페이지는 친구끼리 결과를 비교하며 웃기 위한 엔터테인먼트 도구야.</p></div></main><footer class='footer'><div class='wrap foot'><span>© 오늘뭐함</span><a href='index.html'>홈</a></div></footer><script src='app.js'></script><script>(()=>{let vibe=2;$$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');vibe=+c.dataset.v});go.onclick=()=>{let m=Math.max(0,+mins.value||0),s=Math.max(18,Math.min(96,88-m*.65+vibe*8+randPercent(-5,5)));s=Math.round(s);rt.textContent=s>75?'🔥 대화 계속될 온도':s>50?'🌤️ 아직 판단 보류':'🧊 폰 내려놓고 내 할 일 하기';rd.textContent=s>75?'답장보다 중요한 건 대화가 자연스럽게 이어지는지. 일단 분위기는 괜찮은 세계선.':s>50?'너무 의미 부여하지 말고 다음 대화를 보자. 데이터 한 건으로 결론 금지.':'답장창 새로고침 금지령. 지금 필요한 건 상대 분석보다 내 할 일.';score.textContent=`오늘의 재미용 온도 ${s}°`;bar.style.width=s+'%';showResult(res);window.resultTxt=rt.textContent+' · '+score.textContent};share.onclick=()=>shareResult('썸 답장 온도계',window.resultTxt||'오늘뭐함');save.onclick=()=>downloadResultCard(rt.textContent,rd.textContent,'assets/jayden.webp')})();</script></body></html>
