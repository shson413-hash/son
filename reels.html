<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>5분만 릴스 판독기 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>📱</div><h1>5분만 릴스 판독기</h1><p>“진짜 5분만 보고 끈다”는 발언의 신뢰도를 검사합니다.</p></div><section class='panel'><div class='list'><div class='mini'>현재 집중력 상태</div></div><div class='chips'><button class='chip active' data-risk='8'>멀쩡함</button><button class='chip' data-risk='18'>조금 피곤함</button><button class='chip' data-risk='28'>누워 있음</button><button class='chip' data-risk='40'>이미 릴스 켬</button></div><button class='btn hot wide' id='go'>5분 선언 검증하기</button><div class='result' id='result'><div class='result-emoji'>📉</div><h2 id='title'></h2><p id='desc'></p><div class='countdown' id='minutes'></div><div class='meter'><span id='meter'></span></div><p id='prob'></p><div class='sharebar'><button class='btn secondary' id='again'>다시 우기기</button><button class='btn' id='share'>친구에게 폭로</button></div></div></section><div class='ad-slot'>광고 자리</div></main><script src='app.js'></script><script>(()=>{let risk=8;$$('.chip').forEach(c=>c.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');risk=+c.dataset.risk});function run(){const actual=Math.min(93,Math.max(7,Math.floor(5+risk+Math.random()*38)));const p=Math.min(99,45+risk+Math.floor(Math.random()*25));title.textContent=actual<=12?'기적적으로 약속 지킬 수도 있음':actual<=35?'5분은 이미 전설이 됨':'오늘 알고리즘이 널 놓아주지 않음';desc.textContent=actual<=12?'희귀한 자제력 발현 가능성. 지금이 탈출 타이밍.':actual<=35?'한두 개만 더가 연속으로 발생할 예정.':'배터리보다 먼저 정신력이 방전될 예정.';minutes.textContent=`예상 ${actual}분`;prob.textContent=`5분 실패 확률 ${p}%`;meter.style.width=p+'%';showResult(result)}go.onclick=run;again.onclick=run;share.onclick=()=>shareResult('5분만 릴스 판독기',title.textContent+' · '+minutes.textContent);})();</script></body></html>
