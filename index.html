<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐하지?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: "Pretendard", Arial, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, #9d7cff, transparent 35%),
                radial-gradient(circle at 80% 70%, #ff7eb3, transparent 35%),
                #11121a;

            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;

            padding: 45px 35px;

            text-align: center;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 28px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 50px rgba(0,0,0,0.35);
        }

        h1 {
            margin-top: 0;
            font-size: 42px;
        }

        .subtitle {
            opacity: .7;
            margin-bottom: 35px;
        }

        button {
            border: none;

            padding: 17px 35px;

            font-size: 18px;
            font-weight: bold;

            border-radius: 100px;

            cursor: pointer;

            color: #111;

            background: white;

            transition: .2s;

            box-shadow:
                0 8px 25px rgba(0,0,0,.25);
        }

        button:hover {
            transform: translateY(-4px) scale(1.03);

            box-shadow:
                0 14px 30px rgba(0,0,0,.35);
        }

        button:active {
            transform: scale(.95);
        }

        .result {
            margin-top: 35px;

            min-height: 180px;

            opacity: 0;
            transform: translateY(10px);

            transition: .35s;
        }

        .result.show {
            opacity: 1;
            transform: translateY(0);
        }

        .emoji {
            font-size: 55px;
            margin-bottom: 10px;
        }

        .fortune {
            font-size: 24px;
            font-weight: bold;

            margin-bottom: 18px;
        }

        .mission {
            font-size: 16px;
            opacity: .8;

            line-height: 1.6;
        }

        .luck-title {
            margin-top: 22px;
            font-size: 13px;
            opacity: .6;
        }

        .luck-bar {
            width: 100%;
            height: 10px;

            margin-top: 8px;

            background: rgba(255,255,255,.1);

            border-radius: 20px;

            overflow: hidden;
        }

        .luck {
            width: 0%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #67e8f9,
                #c084fc,
                #fb7185
            );

            border-radius: 20px;

            transition: width 1s cubic-bezier(.2,.8,.2,1);
        }

        .particle {
            position: fixed;

            pointer-events: none;

            font-size: 25px;

            animation: fly 1.6s ease-out forwards;

            z-index: 999;
        }

        @keyframes fly {

            0% {
                transform:
                    translate(0,0)
                    scale(.5)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        var(--x),
                        var(--y)
                    )
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }
        }

        .counter {
            position: fixed;
            bottom: 18px;

            font-size: 12px;

            opacity: .35;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>🔮 오늘 뭐하지?</h1>

    <div class="subtitle">
        우주의 기운에게 오늘의 행동을 맡겨보세요.
    </div>

    <button onclick="draw()">
        운명 뽑기
    </button>

    <div id="result" class="result">

        <div id="emoji" class="emoji">
            ✨
        </div>

        <div id="fortune" class="fortune">
            오늘의 운명
        </div>

        <div id="mission" class="mission">
            버튼을 눌러보세요.
        </div>

        <div class="luck-title">
            오늘의 행운 지수
            <span id="luckNumber"></span>
        </div>

        <div class="luck-bar">
            <div id="luck" class="luck"></div>
        </div>

    </div>

</div>

<div class="counter">
    운명을 확인한 횟수:
    <span id="count">0</span>
</div>


<script>

    const fortunes = [

        ["🔥", "오늘 뭔가 터질 것 같은 날",
            "평소에 미루던 일을 하나 시작해보자."],

        ["🍀", "은근히 운이 좋은 날",
            "평소라면 안 할 선택을 한 번 해보는 것도 좋다."],

        ["☕", "오늘은 천천히 가도 되는 날",
            "맛있는 음료 하나 사서 아무것도 안 하고 15분 쉬기."],

        ["🚀", "생산성이 미쳐 날뛸 가능성 있음",
            "30분만 타이머를 켜고 가장 귀찮은 일을 끝내보자."],

        ["🐈", "고양이처럼 살아도 되는 날",
            "하고 싶은 것 하나를 이유 없이 해보기."],

        ["💰", "돈 냄새가 나는 날",
            "충동구매 말고 통장 잔액을 한 번 확인해보자."],

        ["🧠", "아이디어가 갑자기 튀어나오는 날",
            "떠오르는 생각을 메모장에 아무거나 5개 적어보기."],

        ["🌙", "감성 과다 충전 예정",
            "좋아하는 음악을 틀고 밤 산책을 해보자."],

        ["🎲", "예측 불가능한 하루",
            "오늘 먹을 메뉴를 검색하지 말고 랜덤으로 골라보자."],

        ["👑", "오늘의 주인공은 당신",
            "조금 자신감 넘치게 행동해도 괜찮다."],

        ["🛌", "아무것도 하기 싫은 날",
            "그럴 수도 있다. 대신 해야 할 것 딱 하나만 끝내자."],

        ["⚡", "이상하게 실행력이 좋은 날",
            "생각만 하던 걸 지금 바로 5분만 시작해보기."],

        ["🍰", "작은 보상이 필요한 날",
            "오늘 할 일을 하나 끝낸 뒤 맛있는 걸 먹자."],

        ["🪐", "우주의 흐름이 수상한 날",
            "중요한 결정은 한 번 더 생각하고 보내기 버튼을 누르자."],

        ["💡", "새로운 걸 발견할 가능성이 높은 날",
            "평소 보지 않던 분야의 영상이나 글을 하나 찾아보자."]

    ];


    let count = 0;


    function draw() {

        const result =
            fortunes[
                Math.floor(
                    Math.random() * fortunes.length
                )
            ];


        const luck =
            Math.floor(
                Math.random() * 51
            ) + 50;


        document.getElementById("emoji")
            .textContent = result[0];

        document.getElementById("fortune")
            .textContent = result[1];

        document.getElementById("mission")
            .textContent = result[2];


        document.getElementById("luckNumber")
            .textContent = luck + "%";


        const luckBar =
            document.getElementById("luck");

        luckBar.style.width = "0%";


        setTimeout(() => {
            luckBar.style.width = luck + "%";
        }, 100);


        const resultBox =
            document.getElementById("result");

        resultBox.classList.remove("show");

        setTimeout(() => {
            resultBox.classList.add("show");
        }, 50);


        count++;

        document.getElementById("count")
            .textContent = count;


        explode();
    }


    function explode() {

        const emojis = [
            "✨",
            "⭐",
            "🔥",
            "💫",
            "🍀",
            "🌈",
            "🪐",
            "💎"
        ];


        const centerX =
            window.innerWidth / 2;

        const centerY =
            window.innerHeight / 2;


        for (let i = 0; i < 22; i++) {

            const p =
                document.createElement("div");

            p.className = "particle";


            p.textContent =
                emojis[
                    Math.floor(
                        Math.random() *
                        emojis.length
                    )
                ];


            p.style.left =
                centerX + "px";

            p.style.top =
                centerY + "px";


            const angle =
                Math.random() *
                Math.PI * 2;

            const distance =
                100 +
                Math.random() * 300;


            const x =
                Math.cos(angle) *
                distance;

            const y =
                Math.sin(angle) *
                distance;


            p.style.setProperty(
                "--x",
                x + "px"
            );

            p.style.setProperty(
                "--y",
                y + "px"
            );


            document.body.appendChild(p);


            setTimeout(() => {
                p.remove();
            }, 1600);

        }

    }

</script>

</body>
</html>
