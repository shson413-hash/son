<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>결정 외주센터 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a><nav class='navlinks'><a href='future.html'>10분 뒤</a><a href='decide.html'>결정해줘</a><a href='balance.html'>밸런스</a><a href='food.html'>뭐먹지</a><a href='excuse.html'>핑계제조기</a></nav></div></header><main class='page'><div class='page-head'><div class='big'>🧠</div><h1>결정 외주센터</h1><p>생각하기 귀찮은 인간을 위해 사이트가 책임 없이 대신 정해드립니다.</p></div><section class='panel'><input id='q' class='input' placeholder='예: 이거 살까 말까? / 오늘 공부할까?'><button class='btn hot wide' id='go' style='margin-top:12px'>판단력 반납하기</button><div id='result' class='result'><div class='result-emoji' id='emoji'>⚖️</div><h2 id='answer'></h2><p id='reason'></p><div class='sharebar'><button class='btn secondary' id='again'>재판 요청</button><button class='btn' id='share'>친구한테 책임전가</button></div></div></section><div class='ad-slot'>광고 자리 · 추후 AdSense 연결</div></main><script src='app.js'></script><script>const ans=[['사.','인생은 짧고 카드값은 다음 달의 네가 낸다.','💳'],['사지 마.','장바구니에 24시간 넣어뒀는데도 생각나면 그때 다시 와.','🚫'],['해.','안 해서 찝찝한 것보다 하고 후회하는 게 콘텐츠는 됨.','🔥'],['하지 마.','이미 질문한 순간 하기 싫다는 뜻일 확률 82%.','🛋️'],['오늘은 보류.','결정도 체력이다. 일단 물 한 잔 마시고 다시 생각.','🧊'],['친구 한 명 끌어들여.','혼자 망하면 슬프지만 같이 망하면 추억이다.','🤝'],['동전 던져.','결과 나오기 직전에 네가 진짜 원하는 답이 떠오를 것.','🪙']];function draw(){const a=pick(ans);emoji.textContent=a[2];answer.textContent=a[0];reason.textContent=(q.value?`“${q.value}” → `:'')+a[1];showResult(result)}go.onclick=draw;again.onclick=draw;share.onclick=()=>shareResult('결정 외주 결과',answer.textContent+' '+reason.textContent);</script></body></html>
