<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>사회성 배터리 측정기 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>🪫</div><h1>사회성 배터리 측정기</h1><p>오늘 남은 인간 응대 가능량을 대충 계산합니다.</p></div><section class='panel'><input id='people' class='input' type='number' min='0' max='50' placeholder='오늘 만난 사람 수'><div style='height:12px'></div><button class='btn hot wide' id='go'>배터리 측정</button><div class='result' id='result'><div class='result-emoji' id='emoji'>🔋</div><h2 id='title'></h2><p id='desc'></p><div class='countdown' id='left'></div><div class='meter'><span id='meter'></span></div><div class='sharebar'><button class='btn secondary' id='again'>재측정</button><button class='btn' id='share'>공유</button></div></div></section><div class='ad-slot'>광고 자리</div></main><script src='app.js'></script><script>(()=>{function run(){const n=Math.max(0,Number(people.value||0));const left=Math.max(0,100-(n*11+randPercent(0,20)));emoji.textContent=left>65?'🔋':left>30?'🪫':'💀';title.textContent=left>65?'아직 사람 가능':left>30?'말수 절약 모드':'즉시 귀가 권장';desc.textContent=left>65?'아직 잡담 몇 회 가능.':left>30?'필요한 말만 하고 에너지 보존 추천.':'새로운 약속 제안이 들어오면 못 본 척할 시간.';document.getElementById('left').textContent=`${left}%`;meter.style.width=left+'%';showResult(result)}go.onclick=run;again.onclick=run;share.onclick=()=>shareResult('사회성 배터리',title.textContent+' · '+document.getElementById('left').textContent);})();</script></body></html>
