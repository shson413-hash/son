<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>핑계 제조기 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a><nav class='navlinks'><a href='future.html'>10분 뒤</a><a href='decide.html'>결정해줘</a><a href='balance.html'>밸런스</a><a href='food.html'>뭐먹지</a><a href='excuse.html'>핑계제조기</a></nav></div></header><main class='page'><div class='page-head'><div class='big'>🧾</div><h1>핑계 제조기</h1><p>논리는 약하지만 말투만큼은 당당한 핑계를 생산합니다.</p></div><section class='panel'><input id='situation' class='input' placeholder='예: 지각 / 과제 안 함 / 약속 취소'><button id='go' class='btn hot wide' style='margin-top:12px'>핑계 발급받기</button><div id='result' class='result'><div class='result-emoji'>🫡</div><h2 id='title'>공식 핑계서</h2><p id='text'></p><div class='sharebar'><button class='btn secondary' id='again'>더 뻔뻔한 버전</button><button class='btn' id='copy'>복사</button></div></div></section><div class='ad-slot'>광고 자리 · 핑계 읽다가 한 번 쉬어가기</div></main><script src='app.js'></script><script>const excuses=['제가 원래 시간 개념이 있는데 오늘만 잠깐 서버 점검이 있었습니다.','몸은 출발했는데 정신이 로딩 중이라 동기화가 늦었습니다.','분명 하려고 했는데 우주가 오늘은 아니라고 강하게 말렸습니다.','예상치 못한 현실 이슈가 발생해서 일정이 인간적으로 밀렸습니다.','제가 잘못한 건 맞는데 타이밍이 너무 절묘해서 일단 운명 탓도 조금 하겠습니다.','진짜 변명 같겠지만 저도 이 상황이 이렇게까지 될 줄은 몰랐습니다.','오늘의 저는 어제의 제가 맡긴 업무를 처리 중이라 일정이 꼬였습니다.'];function draw(){const x=pick(excuses);text.textContent=(situation.value?`[${situation.value}] `:'')+x;showResult(result)}go.onclick=draw;again.onclick=draw;copy.onclick=()=>copyResult(text.textContent);</script></body></html>
