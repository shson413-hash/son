<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>오늘 망한 이유 분석기 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>🌀</div><h1>오늘 망한 이유 분석기</h1><p>책임 소재를 전혀 과학적이지 않게 정밀 분석합니다.</p></div><section class='panel'><input id='event' class='input' placeholder='무슨 일이 망했는지 입력 (예: 발표, 다이어트, 약속)'><div style='height:12px'></div><button class='btn hot wide' id='go'>책임 분배 시작</button><div class='result' id='result'><div class='result-emoji'>🧾</div><h2 id='title'></h2><div class='list' id='list'></div><p id='desc'></p><div class='sharebar'><button class='btn secondary' id='again'>재수사</button><button class='btn' id='share'>판결문 공유</button></div></div></section><div class='ad-slot'>광고 자리</div></main><script src='app.js'></script><script>(()=>{const reasons=['내 잘못','와이파이','날씨','수면 부족','배달앱','알고리즘','우주의 기운','카페인 부족','상대방의 텔레파시 실패','월요일의 잔재'];function run(){let remain=100;const picked=[...reasons].sort(()=>Math.random()-.5).slice(0,4),vals=[];for(let i=0;i<3;i++){const max=remain-(3-i)*5;const v=Math.max(5,Math.floor(Math.random()*Math.max(6,max/2))+5);vals.push(v);remain-=v}vals.push(remain);const rows=picked.map((r,i)=>`<div class='mini'>${r} <b style='float:right'>${vals[i]}%</b></div>`).join('');title.textContent=`${event.value.trim()||'오늘의 사건'} 조사 완료`;list.innerHTML=rows;desc.textContent=vals[0]<30?'결론: 단독 범행 아님. 마음 편히 책임을 분산하세요.':'결론: 첫 번째 용의자가 꽤 수상하지만 재심 가능.';showResult(result)}go.onclick=run;again.onclick=run;share.onclick=()=>shareResult('오늘 망한 이유 분석',title.textContent+' · '+desc.textContent);})();</script></body></html>
