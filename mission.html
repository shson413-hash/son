<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>오늘의 이상한 퀘스트 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a><nav class='navlinks'><a href='future.html'>10분 뒤</a><a href='decide.html'>결정해줘</a><a href='balance.html'>밸런스</a><a href='food.html'>뭐먹지</a><a href='excuse.html'>핑계제조기</a></nav></div></header><main class='page'><div class='page-head'><div class='big'>🎯</div><h1>오늘의 이상한 퀘스트</h1><p>해도 인생이 나아지진 않지만 오늘 하루는 조금 덜 심심해짐.</p></div><section class='panel'><button id='go' class='btn hot wide'>퀘스트 수령하기</button><div id='result' class='result'><div class='result-emoji' id='emoji'></div><h2 id='title'></h2><p id='desc'></p><div class='meter'><span id='meter'></span></div><p id='xp'></p><div class='sharebar'><button class='btn secondary' id='again'>퀘스트 리롤</button><button class='btn' id='share'>친구도 끌고 가기</button></div></div></section><div class='ad-slot'>광고 자리 · 퀘스트 사이 휴식구간</div></main><script src='app.js'></script><script>const missions=[['🧊','냉장고 문 열고 10초 고민하기','아무것도 안 꺼내도 성공 처리.'],['📸','오늘 하늘 사진 1장 찍기','잘 찍을 필요 없음. 오늘의 증거 수집.'],['🧹','눈에 보이는 쓰레기 3개만 버리기','대청소 금지. 3개만 하고 뿌듯해하기.'],['🚶','집 밖 7분 걷기','목적지 없음. 인간 업데이트용 산책.'],['📵','휴대폰 뒤집고 5분 버티기','성공하면 현실 세계 DLC 해금.'],['💬','친구에게 뜬금없이 “살아있냐” 보내기','답장 오면 사이드 퀘스트 시작.'],['🥤','물 한 컵 마시기','너무 평범해서 오히려 희귀한 퀘스트.'],['🎵','좋아하는 노래 1곡 끝까지 듣기','중간에 릴스 켜면 실패.'],['🧠','지금 떠오르는 쓸데없는 아이디어 메모하기','미래의 흑역사 또는 사업 아이템이 될 수 있음.']];function draw(){const m=pick(missions),x=randPercent(25,95);emoji.textContent=m[0];title.textContent=m[1];desc.textContent=m[2];xp.textContent=`보상 EXP +${x}`;meter.style.width=x+'%';showResult(result)}go.onclick=draw;again.onclick=draw;share.onclick=()=>shareResult('오늘의 이상한 퀘스트',title.textContent+' — '+desc.textContent);</script></body></html>
