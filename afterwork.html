<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>퇴근 후의 나 시뮬레이터 | 오늘뭐함</title><link rel='stylesheet' href='style.css'></head><body><header class='topbar'><div class='wrap nav'><a class='brand' href='index.html'>🤡 <b>오늘뭐함</b></a></div></header><main class='page'><div class='page-head'><div class='big'>👻</div><h1>퇴근 후의 나 시뮬레이터</h1><p>계획표와 실제 행동 사이의 거대한 간극을 예측합니다.</p></div><section class='panel'><input id='plan' class='input' placeholder='오늘 퇴근 후 계획 입력 (예: 운동, 공부, 장보기)'><div style='height:12px'></div><button class='btn hot wide' id='go'>내 세계선 보기</button><div class='result' id='result'><div class='result-emoji' id='emoji'>🛋️</div><h2 id='title'></h2><p id='desc'></p><div class='meter'><span id='meter'></span></div><p id='prob'></p><div class='sharebar'><button class='btn secondary' id='again'>다른 세계선</button><button class='btn' id='share'>결과 공유</button></div></div></section><div class='ad-slot'>광고 자리</div></main><script src='app.js'></script><script>(()=>{const outs=[['🛋️','침대 세계선','계획은 기억나지만 몸이 협조하지 않음.'],['🍜','먹고 보자 세계선','모든 계획이 식사 뒤로 밀렸고 그 뒤는 알 수 없음.'],['🏃','의외의 갓생 세계선','진짜로 계획을 실행하는 희귀 이벤트 발생.'],['📱','스크롤 세계선','잠깐 폰 본다는 결정이 오늘의 메인 콘텐츠가 됨.'],['🛒','딴짓 생산성 세계선','원래 계획 대신 갑자기 장보기·청소 같은 다른 일을 열심히 함.']];function run(){const o=pick(outs),p=randPercent(55,97),txt=plan.value.trim()||'아무튼 뭔가 생산적인 일';emoji.textContent=o[0];title.textContent=o[1];desc.textContent=`원래 계획: ${txt}. 현실 예측: ${o[2]}`;prob.textContent=`이 세계선 진입 확률 ${p}%`;meter.style.width=p+'%';showResult(result)}go.onclick=run;again.onclick=run;share.onclick=()=>shareResult('퇴근 후의 나',title.textContent+' · '+desc.textContent);})();</script></body></html>
